name: Build
permissions:
  contents: read

on:
  push:
    branches: "*"
    paths-ignore:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - .gitignore
      - "platforms/**"
      - ".github/**"
      - "!.github/workflows/build.yml"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake project
        run: cmake --preset linux-ninja-asan

      - name: Build the project
        run: cmake --build --preset linux-ninja-asan

      - name: Run tests
        run: ./Tests
        working-directory: build

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Create build directory
        run: mkdir build

      - name: Run CMake
        run: cmake .. -G "Visual Studio 18 2026" -A x64
        working-directory: build

      - name: Run MSBuild
        run: cmake --build . --config Debug
        working-directory: build

      - name: Run tests
        run: ./Debug/Tests.exe
        working-directory: build
